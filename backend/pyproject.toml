[project]
name = "memory-agent"
version = "1.0.0"
description = "FastAPI application for Memory Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "python-dotenv==1.2.1",
    "qdrant-client",
    "openai",
    "pydantic",
    "sqlalchemy==2.0.45",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.11",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
